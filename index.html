<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Explorer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    background: #fafafa;
    color: #171717;
    overflow-x: hidden;
  }
  button {
    font: inherit;
    color: inherit;
    background: white;
    border: 3px solid #171717;
    border-radius: 18px;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  button:hover { transform: translateY(-3px); box-shadow: 5px 5px 0 #171717; }
  button:active { transform: translateY(1px); box-shadow: 2px 2px 0 #171717; }

  .screen {
    display: none;
    min-height: 100vh;
    padding: 30px 22px 50px;
    align-items: center;
    justify-content: center;
  }
  .screen.active { display: flex; }

  .panel {
    width: min(1050px, 100%);
    border: 4px solid #171717;
    border-radius: 28px;
    padding: 34px;
    background: white;
    box-shadow: 8px 8px 0 #171717;
  }

  h1 { font-size: clamp(48px, 8vw, 92px); margin: 0 0 15px; letter-spacing: 2px; }
  h2 { font-size: clamp(38px, 6vw, 64px); margin: 0 0 30px; }
  h3 { font-size: 30px; margin: 10px 0; }
  p { font-size: 21px; line-height: 1.5; }

  .center { text-align: center; }
  .sub { font-size: 23px; margin-bottom: 35px; }

  .primary {
    padding: 15px 50px;
    font-size: 30px;
    font-weight: bold;
  }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
  }
  .choice-grid.three { grid-template-columns: repeat(3, 1fr); }
  .choice {
    min-height: 170px;
    padding: 24px;
    font-size: 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .choice small { font-size: 17px; margin-top: 10px; }
  .selected {
    background: #e8e8e8;
    box-shadow: 6px 6px 0 #171717;
    transform: translateY(-3px);
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  .game-card {
    min-height: 330px;
    padding: 20px;
    font-size: 25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .game-icon { font-size: 90px; margin-bottom: 15px; }
  .game-card small { font-size: 17px; }

  .nav {
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:30px;
  }
  .back { padding: 10px 22px; font-size: 20px; }

  /* Gumball machine — hand-drawn style */
  .machine {
    width: 310px;
    margin: 10px auto 28px;
    text-align:center;
    position:relative;
  }
  .machine-top {
    width: 235px;
    height: 235px;
    margin: 0 auto -8px;
    border: 5px solid #171717;
    border-radius: 50% 50% 46% 46%;
    background: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 0 8px #f2f2f2;
  }
  .machine-top:before {
    content:"";
    position:absolute;
    width:170px;
    height:26px;
    left:28px;
    top:28px;
    border:3px solid #171717;
    border-radius:50%;
    transform:rotate(-8deg);
    opacity:.35;
  }
  .ball {
    position:absolute;
    width:42px; height:42px;
    border:3px solid #171717;
    border-radius:50%;
    background:#fff;
  }
  .ball:nth-child(1){left:25px;top:65px}.ball:nth-child(2){left:82px;top:45px}
  .ball:nth-child(3){left:142px;top:70px}.ball:nth-child(4){left:48px;top:112px}
  .ball:nth-child(5){left:105px;top:105px}.ball:nth-child(6){left:160px;top:125px}
  .ball:nth-child(7){left:20px;top:158px}.ball:nth-child(8){left:82px;top:165px}
  .machine-neck {
    width: 54px;
    height: 25px;
    margin: -1px auto 0;
    border: 5px solid #171717;
    border-top: 0;
    background: white;
  }
  .machine-body {
    width: 215px;
    height: 125px;
    margin: -1px auto 0;
    border: 5px solid #171717;
    border-radius: 12px;
    background: #fff;
    position:relative;
  }
  .machine-body:before {
    content:"";
    position:absolute;
    left:22px; right:22px; top:20px;
    height:38px;
    border:3px solid #171717;
    border-radius:7px;
  }
  .machine-slot {
    position:absolute;
    width:70px;
    height:34px;
    left:calc(50% - 35px);
    bottom:13px;
    border:4px solid #171717;
    border-radius:18px;
    background:white;
  }
  .machine-knob {
    width:66px;
    height:66px;
    border:5px solid #171717;
    border-radius:50%;
    background:#fff;
    margin:-32px auto 0;
    position:relative;
    z-index:2;
  }
  .machine-knob:before {
    content:"";
    position:absolute;
    width:5px;
    height:22px;
    background:#171717;
    left:50%;
    top:8px;
    transform:translateX(-50%);
    border-radius:5px;
  }
  .spin { animation: machineShake .45s linear infinite; }
  .spin .machine-knob { animation: knobTurn 1.2s ease-in-out; }
  @keyframes machineShake {
    25%{transform:rotate(2deg)} 75%{transform:rotate(-2deg)}
  }
  @keyframes knobTurn {
    0%{transform:rotate(0)} 50%{transform:rotate(220deg)} 100%{transform:rotate(360deg)}
  }

  /* Slot */
  .slot {
    width:min(560px,100%);
    margin:25px auto;
    border:5px solid #171717;
    border-radius:25px;
    padding:30px;
    background:white;
  }
  .reels { display:flex; justify-content:center; gap:12px; }
  .reel {
    width:125px; height:150px;
    border:4px solid #171717;
    border-radius:15px;
    display:flex; align-items:center; justify-content:center;
    font-size:70px;
    background:#f8f8f8;
  }
  .lever { font-size:50px; margin-top:12px; }

  /* Balloons */
  #balloonArea {
    position:relative;
    width:100%;
    height:430px;
    border:4px solid #171717;
    border-radius:25px;
    overflow:hidden;
    background:linear-gradient(#fff,#f5f5f5);
  }
  .balloon {
    position:absolute;
    width:76px; height:92px;
    border:4px solid #171717;
    border-radius:50% 50% 45% 45%;
    background:white;
    animation: float 2.4s ease-in-out infinite alternate;
  }
  .balloon::after {
    content:"";
    position:absolute;
    width:2px; height:65px;
    background:#171717;
    left:50%; top:86px;
  }
  .balloon:hover { transform:scale(1.12); }
  @keyframes float { from{margin-top:8px} to{margin-top:-12px} }

  /* Result */
  .result {
    text-align:center;
  }
  .result-box {
    border:4px dashed #171717;
    border-radius:25px;
    padding:35px;
    margin:25px 0;
  }
  .result-title { font-size:42px; font-weight:bold; margin-bottom:18px; }
  .tags { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
  .tag { border:2px solid #171717; border-radius:30px; padding:8px 16px; font-size:18px; }

  @media(max-width: 700px){
    .panel { padding:22px; box-shadow:5px 5px 0 #171717; }
    .choice-grid, .choice-grid.three, .game-grid { grid-template-columns:1fr; }
    .choice { min-height:125px; }
    .game-card { min-height:230px; }
    #balloonArea { height:400px; }
  }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="panel center">
    <h1>The Explorer</h1>
    <p class="sub">Your next adventure is waiting.</p>
    <button class="primary" onclick="go('level')">START</button>
  </div>
</section>

<!-- LEVEL -->
<section id="level" class="screen">
  <div class="panel center">
    <h2>LEVEL</h2>
    <div class="choice-grid">
      <button class="choice" onclick="chooseLevel('Easy', this)">EASY<small>Beginner-friendly adventures</small></button>
      <button class="choice" onclick="chooseLevel('Hard', this)">HARD<small>For the brave explorers</small></button>
    </div>
    <div class="nav"><button class="back" onclick="go('home')">← BACK</button></div>
  </div>
</section>

<!-- BUDGET -->
<section id="budget" class="screen">
  <div class="panel center">
    <h2>BUDGET</h2>
    <div class="choice-grid three">
      <button class="choice" onclick="chooseBudget('$0', this)">$0<small>No spending required</small></button>
      <button class="choice" onclick="chooseBudget('$0–350', this)">$0–350<small>A little spending</small></button>
      <button class="choice" onclick="chooseBudget('∞', this)">∞<small>No budget limit</small></button>
    </div>
    <div class="nav"><button class="back" onclick="go('level')">← BACK</button></div>
  </div>
</section>

<!-- GAME CHOICE -->
<section id="games" class="screen">
  <div class="panel center">
    <h2>CHOOSE YOUR GAME</h2>
    <div class="game-grid">
      <button class="game-card" onclick="startGame('gumball')">
        <div class="game-icon">🫧</div>
        <strong>GUMBALL MACHINE</strong>
        <small>Get a random ball</small>
      </button>
      <button class="game-card" onclick="startGame('balloon')">
        <div class="game-icon">🎈</div>
        <strong>SHOOT THE BALLOON</strong>
        <small>Pop one to reveal your adventure</small>
      </button>
      <button class="game-card" onclick="startGame('slot')">
        <div class="game-icon">🎰</div>
        <strong>SLOT MACHINE</strong>
        <small>Spin for your adventure</small>
      </button>
    </div>
    <div class="nav"><button class="back" onclick="go('budget')">← BACK</button></div>
  </div>
</section>

<!-- GUMBALL -->
<section id="gumball" class="screen">
  <div class="panel center">
    <h2>GUMBALL MACHINE</h2>
    <p>Press the button and let fate choose!</p>
    <div class="machine" id="gumballMachine">
      <div class="machine-top">
        <div class="ball"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div>
        <div class="ball"></div><div class="ball"></div><div class="ball"></div><div class="ball"></div>
      </div>
      <div class="machine-neck"></div>
      <div class="machine-body">
        <div class="machine-slot"></div>
      </div>
      <div class="machine-knob"></div>
    </div>
    <button class="primary" onclick="gumballSpin()">TURN</button>
    <div class="nav"><button class="back" onclick="go('games')">← BACK</button></div>
  </div>
</section>

<!-- BALLOON -->
<section id="balloon" class="screen">
  <div class="panel center">
    <h2>SHOOT THE BALLOON</h2>
    <p>Choose one balloon. Don't overthink it.</p>
    <div id="balloonArea"></div>
    <div class="nav"><button class="back" onclick="go('games')">← BACK</button></div>
  </div>
</section>

<!-- SLOT -->
<section id="slot" class="screen">
  <div class="panel center">
    <h2>SLOT MACHINE</h2>
    <p>Spin the reels and see what you get.</p>
    <div class="slot">
      <div class="reels">
        <div class="reel" id="r1">7</div>
        <div class="reel" id="r2">7</div>
        <div class="reel" id="r3">7</div>
      </div>
      <div class="lever">↕</div>
    </div>
    <button class="primary" onclick="slotSpin()">SPIN</button>
    <div class="nav"><button class="back" onclick="go('games')">← BACK</button></div>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="panel result">
    <h2>YOUR ADVENTURE</h2>
    <div class="result-box">
      <div class="result-title" id="resultTitle"></div>
      <p id="resultText"></p>
      <div class="tags">
        <span class="tag" id="levelTag"></span>
        <span class="tag" id="budgetTag"></span>
      </div>
    </div>
    <button class="primary" onclick="go('games')">TRY AGAIN</button>
    <button class="back" onclick="go('home')" style="margin-left:10px">HOME</button>
  </div>
</section>

<script>
const state = { level:null, budget:null };

const adventures = [
  {level:"Easy", budget:"$0", title:"The Random Walk", text:"Take a walk somewhere you've never explored before. You have to turn left at every third intersection."},
  {level:"Easy", budget:"$0", title:"Photo Hunt", text:"Go outside and take 5 photos of things you normally ignore. Give each photo a ridiculous title."},
  {level:"Easy", budget:"$0–350", title:"New Flavor", text:"Visit a place you've never eaten at before and order something you've never tried."},
  {level:"Easy", budget:"∞", title:"Tourist in Your Own City", text:"Spend an afternoon exploring your own city like you're visiting for the first time."},
  {level:"Hard", budget:"$0", title:"No-Plan Expedition", text:"Leave home with no destination. Pick a direction and keep going for one hour."},
  {level:"Hard", budget:"$0–350", title:"Mystery Stop", text:"Take public transportation to a random stop you've never visited and explore for two hours."},
  {level:"Hard", budget:"∞", title:"Full-Day Escape", text:"Plan a full-day adventure somewhere you've never been. No returning home until your planned adventure is complete."},
  {level:"Hard", budget:"$0–350", title:"Three Missions", text:"Complete three challenges in one day: try a new food, visit a new place, and talk to someone you've never met."},
  {level:"Easy", budget:"$0–350", title:"Thrift Treasure", text:"Set a small budget and find the weirdest or funniest item you can."},
  {level:"Hard", budget:"∞", title:"Sunrise Mission", text:"Wake up early and go somewhere you've never watched the sunrise before."}
];

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function chooseLevel(level, btn){
  state.level = level;
  document.querySelectorAll('#level .choice').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  setTimeout(()=>go('budget'),180);
}

function chooseBudget(budget, btn){
  state.budget = budget;
  document.querySelectorAll('#budget .choice').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  setTimeout(()=>go('games'),180);
}

function getAdventure(){
  let possible = adventures.filter(a => a.level===state.level && a.budget===state.budget);
  if(!possible.length) possible = adventures.filter(a => a.level===state.level);
  if(!possible.length) possible = adventures;
  return possible[Math.floor(Math.random()*possible.length)];
}

function reveal(){
  const a = getAdventure();
  document.getElementById('resultTitle').textContent = a.title;
  document.getElementById('resultText').textContent = a.text;
  document.getElementById('levelTag').textContent = "LEVEL: " + state.level;
  document.getElementById('budgetTag').textContent = "BUDGET: " + state.budget;
  go('result');
}

function startGame(type){
  go(type);
  if(type==='balloon') makeBalloons();
}

function gumballSpin(){
  const m=document.getElementById('gumballMachine');
  m.classList.add('spin');
  setTimeout(()=>{m.classList.remove('spin'); reveal();},1200);
}

function slotSpin(){
  const reels=[document.getElementById('r1'),document.getElementById('r2'),document.getElementById('r3')];
  let count=0;
  const interval=setInterval(()=>{
    reels.forEach(r=>r.textContent=["7","★","?","!","●"][Math.floor(Math.random()*5)]);
    count++;
    if(count>14){
      clearInterval(interval);
      reels.forEach(r=>r.textContent="7");
      setTimeout(reveal,350);
    }
  },90);
}

function makeBalloons(){
  const area=document.getElementById('balloonArea');
  area.innerHTML="";
  const positions=[
    [7,18],[25,10],[45,24],[66,8],[84,22],
    [15,55],[36,48],[57,60],[77,50],[88,72],
    [4,78],[27,80],[48,76],[69,82]
  ];
  positions.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='balloon';
    b.style.left=p[0]+"%";
    b.style.top=p[1]+"%";
    b.style.animationDelay=(i*.12)+"s";
    b.setAttribute("aria-label","Pop balloon");
    b.onclick=()=>{
      area.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;font-size:70px">💥</div>';
      setTimeout(reveal,500);
    };
    area.appendChild(b);
  });
}
</script>
</body>
</html>
